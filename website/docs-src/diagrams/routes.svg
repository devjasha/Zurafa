<svg viewBox="0 0 860 290" role="img" aria-labelledby="routes-title routes-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="routes-title">How a remote tab picks its route</title>
  <desc id="routes-desc">A new remote tab checks whether the host is a Tailscale peer. If it is, it tries HTTPS on port 443 through Tailscale Serve, then HTTP on port 7297, then the SSH bridge, then plain ssh. Other hosts go straight to the SSH bridge. The first route that answers connects the tab, and reconnects keep that route.</desc>
  <defs>
    <marker id="routes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker>
    <marker id="routes-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head-ok" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <rect class="dg-box" x="16" y="117" width="140" height="56" rx="10"/>
  <text class="dg-title" x="86" y="140" text-anchor="middle">Open a</text>
  <text class="dg-title" x="86" y="157" text-anchor="middle">remote tab</text>

  <rect class="dg-box dg-accent dg-dashed" x="190" y="109" width="170" height="72" rx="10"/>
  <text class="dg-title" x="275" y="141" text-anchor="middle">Is the host a</text>
  <text class="dg-title" x="275" y="158" text-anchor="middle">Tailscale peer?</text>

  <path class="dg-edge" d="M156 145H186" marker-end="url(#routes-arrow)"/>
  <path class="dg-edge dg-edge-accent" d="M360 131H378V39H396" marker-end="url(#routes-arrow)"/>
  <text class="dg-label" x="372" y="96" text-anchor="end">yes</text>
  <path class="dg-edge" d="M360 159H378V179H396" marker-end="url(#routes-arrow)"/>
  <text class="dg-label" x="372" y="198" text-anchor="end">no</text>

  <rect class="dg-box dg-accent" x="400" y="14" width="290" height="50" rx="10"/>
  <text class="dg-title" x="416" y="35">1 · HTTPS :443 via Tailscale Serve</text>
  <text class="dg-sub" x="416" y="52">*.ts.net names only; certificate checked</text>

  <rect class="dg-box dg-accent" x="400" y="84" width="290" height="50" rx="10"/>
  <text class="dg-title" x="416" y="105">2 · HTTP :7297 tailnet listener</text>
  <text class="dg-sub" x="416" y="122">plain HTTP inside WireGuard</text>

  <rect class="dg-box" x="400" y="154" width="290" height="50" rx="10"/>
  <text class="dg-title" x="416" y="175">3 · SSH bridge</text>
  <text class="dg-sub" x="416" y="192">installs the daemon on first use</text>

  <rect class="dg-box" x="400" y="224" width="290" height="50" rx="10"/>
  <text class="dg-title" x="416" y="245">4 · Plain ssh -tt</text>
  <text class="dg-sub" x="416" y="262">always works, but no reconnect</text>

  <path class="dg-edge" d="M545 64V80" marker-end="url(#routes-arrow)"/>
  <text class="dg-label" x="553" y="77">if it fails</text>
  <path class="dg-edge" d="M545 134V150" marker-end="url(#routes-arrow)"/>
  <text class="dg-label" x="553" y="147">if it fails</text>
  <path class="dg-edge" d="M545 204V220" marker-end="url(#routes-arrow)"/>
  <text class="dg-label" x="553" y="217">if it fails</text>

  <path class="dg-edge dg-edge-ok" d="M690 39H712M690 109H712M690 179H712M690 249H712M712 39V249"/>
  <path class="dg-edge dg-edge-ok" d="M712 144H744" marker-end="url(#routes-arrow-ok)"/>
  <rect class="dg-box dg-ok" x="748" y="112" width="104" height="64" rx="10"/>
  <text class="dg-title" x="800" y="138" text-anchor="middle">Connected</text>
  <text class="dg-sub" x="800" y="155" text-anchor="middle">reconnects keep</text>
  <text class="dg-sub" x="800" y="169" text-anchor="middle">this route</text>
</svg>
