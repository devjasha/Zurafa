[package]
name = "zurafa-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
zurafa-events = { path = "../zurafa-events" }
base64 = "0.22"
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "signal"] }
