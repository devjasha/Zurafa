[package]
name = "zurafa-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
zurafa-events = { path = "../zurafa-events" }
base64 = "0.22"
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "macros", "signal", "time", "process"] }

# TLS for remote tabs that reach a host through Tailscale Serve (HTTPS). Only the Mac app opens tabs.
[target.'cfg(target_os = "macos")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
